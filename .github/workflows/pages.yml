name: Build and deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege that still allows a Pages deploy.
permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once, but let a newer push finish rather than
# cancelling it, so the published site always matches the latest commit.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Image derivatives are generated rather than committed, so the 43 MB of
      # masters in images/ never reach the published site.
      - name: Generate image derivatives
        run: npm run images

      - name: Build both targets and all concepts
        run: npm run build

      # Fails the build if an unscoped selector, a stray <h1>, a relative asset
      # path, or a missing accessibility affordance reaches the Sidearm output.
      - name: Check output
        run: npm run check

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
