name: Build and deploy Pages

on:
  push:
    branches: [main]
  # Build and check on pull requests too, so a broken build or an unscoped
  # selector is caught before merge rather than after. Only the deploy job is
  # gated to main.
  pull_request:
  workflow_dispatch:

# Least privilege that still allows a Pages deploy.
permissions:
  contents: read
  pages: write
  id-token: write

# One run per ref, so a pull request check never queues behind a main deploy.
# Superseded pull request runs are cancelled; main runs are not, so the
# published site always matches the latest commit.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Image derivatives are generated rather than committed, so the 43 MB of
      # masters in images/ never reach the published site.
      - name: Generate image derivatives
        run: npm run images

      - name: Build both targets and all concepts
        run: npm run build

      # Fails the build if an unscoped selector, a stray <h1>, a relative asset
      # path, or a missing accessibility affordance reaches the Sidearm output.
      - name: Check output
        run: npm run check

      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    needs: build
    # Publishing only happens from main. On a pull request the build job runs
    # for its checks and stops there.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
